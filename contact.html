            <!-- Form kirim pesan via WhatsApp -->
            <form id="waForm">
                <label for="name">Nama:</label>
                <input type="text" id="name" name="name" required>

                <label for="message">Pesan:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Kirim via WhatsApp</button>
            </form>
        </section>

    <script>
        document.getElementById("waForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const message = document.getElementById("message").value;
            const phone = "62812xxxxxxx"; // ganti dengan nomor WA kamu tanpa tanda + atau strip

            const url = `https://wa.me/${phone}?text=Halo, saya ${name}.%0A${message}`;
            window.open(url, "_blank");
        });
    </script>
